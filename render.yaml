# One-click hosting on Render (https://render.com): New → Blueprint → pick this GitHub repo.
# Secrets marked "sync: false" are typed into Render's dashboard, never into this file.
services:
  - type: web
    name: clinora
    runtime: python
    plan: starter            # paid plan: stays awake 24x7 and can use a disk
    region: singapore        # closest to India; change if most users are elsewhere
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ENV
        value: production
      - key: DATA_DIR            # database, profile photos and work photos live on the disk below
        value: /var/data
      - key: PUBLIC_URL          # e.g. https://your-domain.in (your domain, with https)
        sync: false
      - key: SUPPORT_EMAIL       # shown on the Privacy, Terms and Delete-account pages
        sync: false
      - key: ADMIN_SETUP_CODE    # a long secret you choose; needed once to create the clinic admin account
        sync: false
      - key: SMTP_HOST           # email for password resets and reminders (docs/email-setup.md)
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID    # optional social login (docs/social-login.md)
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: BACKUP_S3_ENDPOINT  # cloud copy of the daily backup (docs/backups.md)
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_EVERY_HOURS  # 1 on free hosting; the default 24 is fine with a disk
        sync: false
      - key: CHAT_PER_HOUR       # AI chat messages per visitor per hour (default 60)
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWA_PACKAGE         # Android app id after you make the Play Store app, e.g. com.clinora.app
        sync: false
      - key: TWA_SHA256          # "App signing key certificate" SHA-256 from Play Console
        sync: false
    disk:
      name: clinora-data
      mountPath: /var/data
      sizeGB: 5               # database, photos, videos and 14 days of backups
